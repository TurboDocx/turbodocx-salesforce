version: 2

updates:
  # npm dev dependencies (LWC Jest) - security updates only
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "security"
      include: "scope"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # GitHub Actions - keep pinned SHAs current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
